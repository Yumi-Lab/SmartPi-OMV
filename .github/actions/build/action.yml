name: "MainsailOS/build"
author: "Stefan Dej"
description: "Build MainsailOS images"
inputs:
  config:
    description: "Board config name"
    required: true
  custompios-repository:
    description: "Repository for CustomPiOS"
    required: false
    default: "Yumi-Lab/CustomPiOS-Yumi"
  custompios-ref:
    description: "Branch / Tag / SHA to checkout CustomPiOS"
    required: false
    default: "1.5.0"
outputs:
  type:
    description: SBC type (raspberry/armbian/...)
    value: ${{ steps.config.outputs.TYPE }}
  sbc:
    description: SBC model (rpi32/orangepi4lts/...)
    value: ${{ steps.config.outputs.SBC }}

runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      shell: bash
      run: sudo apt update; sudo apt install --yes aria2 coreutils jq p7zip-full qemu-user-static zip

    - name: Checkout CustomPiOS
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.custompios-repository }}
        ref: ${{ inputs.custompios-ref }}
        path: CustomPiOS

    - name: Read board config
      id: config
      shell: bash
      run: |
        IFS='/' read -r -a array <<< "${{ inputs.config }}"
        TYPE=${array[0]}
        SBC=${array[1]}

        echo "TYPE=${TYPE}" >> $GITHUB_OUTPUT
        echo "SBC=${SBC}" >> $GITHUB_OUTPUT

        GENERIC_FILE="./repository/config/default"
        if [[ -f "$GENERIC_FILE" ]]; then
          cat "${GENERIC_FILE}" >> ./repository/src/config
        fi

        TYPE_FILE="./repository/config/${TYPE}/default"
        if [[ -f "$TYPE_FILE" ]]; then
          cat "${TYPE_FILE}" >> ./repository/src/config
        fi

        SBC_FILE="./repository/config/${TYPE}/${SBC}"
        if [[ -f "$SBC_FILE" ]]; then
          cat "${SBC_FILE}" >> ./repository/src/config
        fi

        source ./repository/src/config

        echo $DOWNLOAD_URL_CHECKSUM
        echo $DOWNLOAD_URL_IMAGE
        echo $MODULES
        echo $(cat ./repository/src/config)

        echo "DOWNLOAD_URL_CHECKSUM=${DOWNLOAD_URL_CHECKSUM}" >> $GITHUB_OUTPUT
        echo "DOWNLOAD_URL_IMAGE=${DOWNLOAD_URL_IMAGE}" >> $GITHUB_OUTPUT
        echo "MODULES=${MODULES}" >> $GITHUB_OUTPUT

    - name: Base Image Checksum
      id: checksum
      shell: bash
      run: |
        cd repository/src/image
        FILENAME=$(basename ${{ steps.config.outputs.DOWNLOAD_URL_CHECKSUM }})
        wget -O ${FILENAME} ${{ steps.config.outputs.DOWNLOAD_URL_CHECKSUM }}
        FILE_CONTENT=$(head -n 1 $FILENAME)
        CHECKSUM=$(echo $FILE_CONTENT | cut -d' ' -f1)

        echo "CHECKSUM=${CHECKSUM}" >> $GITHUB_OUTPUT
        echo "FILENAME=${FILENAME}" >> $GITHUB_OUTPUT

    - name: Cache Base Source Image
      id: cache
      uses: actions/cache@v4
      with:
        path: repository/src/image/*.img.xz
        key: base-image-${{ steps.checksum.outputs.CHECKSUM }}

    - name: Download Base Source Image via Torrent
      if: steps.cache.outputs.cache-hit != 'true' && endswith(steps.config.outputs.DOWNLOAD_URL_IMAGE, '.torrent')
      shell: bash
      run: aria2c -d repository/src/image --seed-time=0 ${{ steps.config.outputs.DOWNLOAD_URL_IMAGE }}

    - name: Download Base Source Image via wget
      if: steps.cache.outputs.cache-hit != 'true' && !endswith(steps.config.outputs.DOWNLOAD_URL_IMAGE, '.torrent')
      shell: bash
      run: |
        cd repository/src/image
        wget ${{ steps.config.outputs.DOWNLOAD_URL_IMAGE }}

    - name: Comparing Checksums
      shell: bash
      run: |
        cd repository/src/image
        IMAGE_FILE=$(basename "${{ steps.config.outputs.DOWNLOAD_URL_IMAGE }}")
        EXPECTED="${{ steps.checksum.outputs.CHECKSUM }}"
        ACTUAL=$(sha256sum -b "${IMAGE_FILE}" | cut -d' ' -f1)
        if [ "${EXPECTED}" != "${ACTUAL}" ]; then
          echo "Checksum mismatch! expected=${EXPECTED} actual=${ACTUAL}"
          exit 1
        fi
        echo "Checksum OK: ${ACTUAL}"

    - name: Update CustomPiOS Paths
      shell: bash
      run: cd repository/src && ../../CustomPiOS/src/update-custompios-paths

    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force 2>/dev/null || true
        df -h

    - name: Build Image
      shell: bash
      run: sudo modprobe loop && cd repository/src && sudo bash -x ./build_dist

    - name: Filesystem check (e2fsck)
      shell: bash
      run: |
        IMG=$(sudo find repository/src/workspace -name "*.img" | head -1)
        LOOP=$(sudo losetup -fP --show "$IMG")
        sleep 1
        sudo e2fsck -fy "${LOOP}p2"
        RET=$?
        if [ $RET -gt 2 ]; then
          echo "❌ e2fsck failed with code $RET — filesystem is corrupt"
          sudo losetup -d "$LOOP"
          exit 1
        fi
        echo "✅ e2fsck passed (code $RET)"
        sudo losetup -d "$LOOP"

    - name: Smoke test — mount image and verify structure
      shell: bash
      run: |
        IMG=$(sudo find repository/src/workspace -name "*.img" | head -1)
        LOOP=$(sudo losetup -fP --show "$IMG")
        sleep 1
        MNT=$(mktemp -d)
        sudo mount -o ro "${LOOP}p2" "$MNT"
        FAIL=0
        check() {
          if [ -e "$MNT/$1" ]; then echo "  OK  $1"; else echo "  FAIL  $1"; FAIL=1; fi
        }
        check_dir() {
          if [ -d "$MNT/$1" ]; then echo "  OK  $1/"; else echo "  FAIL  $1/"; FAIL=1; fi
        }
        check_link() {
          if [ -L "$MNT/$1" ]; then echo "  OK  $1 -> $(readlink "$MNT/$1")"; else echo "  FAIL  $1 (not a symlink)"; FAIL=1; fi
        }
        check_exec() {
          if [ -x "$MNT/$1" ]; then echo "  OK  $1 (exec)"; else echo "  FAIL  $1 (not executable)"; FAIL=1; fi
        }

        echo "=== Armbian base ==="
        check etc/armbian-release
        grep -qP "BRANCH=.+" "$MNT/etc/armbian-release" && echo "  OK  BRANCH has value" || { echo "  FAIL  BRANCH empty in armbian-release"; FAIL=1; }
        grep -qP "LINUXFAMILY=.+" "$MNT/etc/armbian-release" && echo "  OK  LINUXFAMILY has value" || { echo "  FAIL  LINUXFAMILY empty in armbian-release"; FAIL=1; }

        echo "=== OpenMediaVault repository ==="
        check usr/share/keyrings/openmediavault-archive-keyring.gpg
        check etc/apt/sources.list.d/openmediavault.list
        grep -q "sandworm main" "$MNT/etc/apt/sources.list.d/openmediavault.list" && echo "  OK  sandworm repo entry" || { echo "  FAIL  sandworm repo entry missing"; FAIL=1; }

        echo "=== OpenMediaVault package preload ==="
        check_dir var/cache/omv-preload
        DEB_COUNT=$(sudo find "$MNT/var/cache/omv-preload" -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l)
        if [ "$DEB_COUNT" -gt 50 ]; then echo "  OK  $DEB_COUNT .deb pre-downloaded"; else echo "  FAIL  only $DEB_COUNT .deb in preload cache"; FAIL=1; fi
        sudo find "$MNT/var/cache/omv-preload" -maxdepth 1 -name 'openmediavault_*.deb' 2>/dev/null | grep -q . && echo "  OK  openmediavault_*.deb present" || { echo "  FAIL  openmediavault_*.deb missing"; FAIL=1; }
        sudo find "$MNT/var/lib/apt/lists" -maxdepth 1 -name '*openmediavault*Packages*' 2>/dev/null | grep -q . && echo "  OK  omv apt lists baked in" || { echo "  FAIL  omv apt lists missing"; FAIL=1; }

        echo "=== Firstboot installer ==="
        check_exec usr/local/bin/omv-firstboot
        check etc/systemd/system/omv-firstboot.service
        check etc/omv-firstboot.conf
        check .omv_firstboot
        check_link etc/systemd/system/multi-user.target.wants/omv-firstboot.service

        echo "=== Disk usage ==="
        df -h "$MNT" | tail -1

        sudo umount "$MNT"
        rmdir "$MNT"
        sudo losetup -d "$LOOP"
        [ $FAIL -eq 0 ] || { echo ""; echo "SMOKE TEST FAILED — see above"; exit 1; }

    - name: Cleanup workspace & fix permissions
      if: success()
      shell: bash
      run: |
        # Clean up workspace
        path="${{ github.workspace }}/repository/src/workspace"
        sudo rm -rfv ${path}/aptcache
        sudo rm -rfv ${path}/mount
        sudo rm -rfv ${path}/chroot_script

        sudo chown -v -R ${USER}:${USER} ${path}
        sudo chmod 0775 -v -R ${path}
